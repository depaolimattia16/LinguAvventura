<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linguavventura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3E7;
    --paper-line:#E4D6BC;
    --paper-margin:#E88A7D;
    --card-bg:#FFFDF8;
    --ink:#2B4570;
    --ink-soft:#5B729C;
    --coral:#E4572E;
    --coral-dark:#C43F1B;
    --grass:#4C9A6A;
    --grass-dark:#357A4E;
    --sun:#F4B942;
    --sun-dark:#D99B1F;
    --plum:#8E5A9E;
    --charcoal:#2E2A26;
    --charcoal-soft:#6B6156;
    --shadow-hard: 3px 3px 0 rgba(46,42,38,0.18);
    --radius-sticker: 16px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1C1914;
      --paper-line:#332C22;
      --paper-margin:#8A4238;
      --card-bg:#26221C;
      --ink:#AFC4EC;
      --ink-soft:#8496BE;
      --charcoal:#F2ECE1;
      --charcoal-soft:#B9AF9F;
      --shadow-hard: 3px 3px 0 rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1914;
    --paper-line:#332C22;
    --paper-margin:#8A4238;
    --card-bg:#26221C;
    --ink:#AFC4EC;
    --ink-soft:#8496BE;
    --charcoal:#F2ECE1;
    --charcoal-soft:#B9AF9F;
    --shadow-hard: 3px 3px 0 rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--paper) 31px, var(--paper-line) 32px) 0 38px / 100% 32px,
      var(--paper);
    color:var(--charcoal);
    font-family:'Nunito', system-ui, sans-serif;
    min-height:100vh;
    position:relative;
    padding-left:34px;
    font-size:16px;
    line-height:1.5;
  }
  body::before{
    content:"";
    position:fixed;
    top:0;left:26px;bottom:0;
    width:2px;
    background:var(--paper-margin);
    opacity:.55;
    pointer-events:none;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', system-ui, sans-serif;
    color:var(--ink);
    margin:0 0 .3em 0;
    line-height:1.15;
  }
  h1{font-size:clamp(1.7rem,5vw,2.5rem);}
  h2{font-size:clamp(1.3rem,4vw,1.7rem);}
  h3{font-size:1.15rem;}
  p{margin:.4em 0;}
  button{font-family:inherit;}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}

  /* topbar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    max-width:720px;margin:0 auto;padding:14px 16px 0;
    font-family:'Baloo 2';
  }
  .topbar .stats{display:flex;gap:10px;font-size:.95rem;color:var(--ink-soft);}
  .pill{
    background:var(--card-bg);border:2px solid var(--paper-line);
    border-radius:999px;padding:4px 12px;white-space:nowrap;
  }
  .back-btn{
    background:none;border:none;color:var(--ink);font-family:'Baloo 2';
    font-size:1rem;font-weight:700;cursor:pointer;padding:6px 4px;
    display:flex;align-items:center;gap:4px;
  }
  .back-btn:hover{color:var(--coral);}

  /* buttons */
  .btn{
    font-family:'Baloo 2';font-weight:700;font-size:1.02rem;
    border:none;border-radius:12px;padding:14px 20px;cursor:pointer;
    box-shadow:var(--shadow-hard);transition:transform .12s ease;
    color:#fff;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
  .btn-ink{background:var(--ink);}
  .btn-coral{background:var(--coral);}
  .btn-grass{background:var(--grass);}
  .btn-sun{background:var(--sun-dark);}
  .btn-plum{background:var(--plum);}
  .btn-block{display:block;width:100%;text-align:left;}
  .btn-ghost{
    background:transparent;color:var(--ink);border:2px dashed var(--paper-line);
    box-shadow:none;
  }
  .btn-ghost:hover{border-color:var(--ink);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  /* hero */
  .hero{text-align:center;padding:10px 0 6px;}
  .hero .mascot{width:110px;height:110px;margin:0 auto 6px;}
  .hero p{color:var(--charcoal-soft);max-width:44ch;margin:6px auto 0;}

  /* menu grid */
  .menu-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:22px;}
  @media(min-width:480px){.menu-grid{grid-template-columns:1fr 1fr;}}
  .menu-card{
    background:var(--card-bg);border-radius:var(--radius-sticker);
    padding:18px 18px 16px;box-shadow:var(--shadow-hard);
    border:2px solid var(--paper-line);cursor:pointer;text-align:left;
    transform:rotate(var(--r,0deg));transition:transform .15s ease;
    display:flex;flex-direction:column;gap:4px;width:100%;
  }
  .menu-card:hover{transform:rotate(0deg) translateY(-3px);}
  .menu-card:nth-child(1){--r:-1deg;}
  .menu-card:nth-child(2){--r:1deg;}
  .menu-card:nth-child(3){--r:-1.2deg;}
  .menu-card:nth-child(4){--r:0.8deg;}
  .menu-card .emoji{font-size:1.8rem;}
  .menu-card h3{margin:2px 0 0;color:var(--ink);}
  .menu-card span.desc{color:var(--charcoal-soft);font-size:.9rem;}

  /* mode cards (gioco) */
  .mode-list{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .mode-card{
    background:var(--card-bg);border-radius:var(--radius-sticker);
    border:2px solid var(--paper-line);padding:14px 16px;
    display:flex;align-items:center;gap:14px;cursor:pointer;
    box-shadow:var(--shadow-hard);text-align:left;width:100%;
  }
  .mode-card:hover{border-color:var(--coral);}
  .mode-card .emoji{font-size:1.6rem;flex-shrink:0;}
  .mode-card .txt strong{display:block;color:var(--ink);font-family:'Baloo 2';}
  .mode-card .txt span{color:var(--charcoal-soft);font-size:.88rem;}

  /* quiz area */
  .quiz-card{
    background:var(--card-bg);border-radius:var(--radius-sticker);
    border:2px solid var(--paper-line);box-shadow:var(--shadow-hard);
    padding:28px 22px;text-align:center;margin-top:18px;
  }
  .quiz-word{
    font-family:'Baloo 2';font-weight:800;font-size:clamp(1.8rem,7vw,2.6rem);
    color:var(--ink);margin:6px 0 22px;word-break:break-word;
  }
  .quiz-prompt{color:var(--charcoal-soft);font-size:.95rem;margin-bottom:2px;}
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  @media(max-width:420px){.options-grid{grid-template-columns:1fr;}}
  .option-btn{
    font-family:'Baloo 2';font-weight:700;font-size:1rem;
    background:#fff;border:2px solid var(--paper-line);border-radius:12px;
    padding:14px 10px;cursor:pointer;color:var(--ink);
  }
  .option-btn:hover{border-color:var(--ink);}
  .option-btn.correct{background:var(--grass);border-color:var(--grass-dark);color:#fff;}
  .option-btn.wrong{background:var(--coral);border-color:var(--coral-dark);color:#fff;}
  .option-btn:disabled{cursor:default;}
  .feedback{font-family:'Baloo 2';font-weight:700;margin-top:16px;font-size:1.1rem;}
  .feedback.ok{color:var(--grass-dark);}
  .feedback.bad{color:var(--coral-dark);}
  .progress-line{color:var(--charcoal-soft);font-size:.85rem;margin-bottom:4px;}
  .quiz-grid-4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
  @media(max-width:420px){.quiz-grid-4{grid-template-columns:1fr;}}
  .word-tile{
    font-family:'Baloo 2';font-weight:700;font-size:1.3rem;
    background:#fff;border:2px solid var(--paper-line);border-radius:12px;
    padding:20px 10px;cursor:pointer;color:var(--ink);
  }
  .word-tile:hover{border-color:var(--ink);}
  .word-tile.correct{background:var(--grass);border-color:var(--grass-dark);color:#fff;}
  .word-tile.wrong{background:var(--coral);border-color:var(--coral-dark);color:#fff;}

  /* progress bar generic */
  .bar-bg{background:var(--paper-line);border-radius:999px;height:14px;overflow:hidden;}
  .bar-fill{background:var(--grass);height:100%;border-radius:999px;transition:width .3s ease;}

  /* settings */
  .settings-block{
    background:var(--card-bg);border:2px solid var(--paper-line);
    border-radius:var(--radius-sticker);padding:16px 18px;margin-top:16px;
  }
  .settings-block h3{margin-bottom:8px;}
  .check-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-weight:700;color:var(--charcoal);}
  .check-row input{width:20px;height:20px;accent-color:var(--grass);flex-shrink:0;}
  .hint{color:var(--charcoal-soft);font-size:.85rem;margin-top:6px;}
  .blackboard{
    background:#2E4A3B;color:#F2ECE1;border-radius:var(--radius-sticker);
    padding:16px 18px;border:3px dashed #F2ECE1;margin-top:16px;
  }
  .blackboard h3{color:#F2ECE1;}
  .blackboard .check-row{color:#F2ECE1;}
  .blackboard .hint{color:#C9D8CE;}

  /* progress screen */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .stat-card{
    background:var(--card-bg);border:2px solid var(--paper-line);
    border-radius:14px;padding:14px;text-align:center;
  }
  .stat-card .big{font-family:'Baloo 2';font-size:1.6rem;color:var(--ink);font-weight:800;}
  .stat-card .lbl{font-size:.8rem;color:var(--charcoal-soft);}
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:14px;}
  .badge{
    text-align:center;padding:10px 4px;border-radius:12px;
    border:2px solid var(--paper-line);background:var(--card-bg);
  }
  .badge.locked{opacity:.35;filter:grayscale(1);}
  .badge .ic{font-size:1.6rem;}
  .badge .nm{font-size:.72rem;font-weight:700;color:var(--charcoal);margin-top:2px;}

  /* boss */
  .hp-row{display:flex;justify-content:center;gap:6px;margin:6px 0 4px;font-size:1.4rem;}
  .hearts{display:flex;justify-content:center;gap:6px;margin:10px 0 2px;font-size:1.3rem;}

  /* classroom */
  .team-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center;}
  .team-box{
    flex:1;min-width:110px;text-align:center;border-radius:14px;
    padding:12px;border:2px solid var(--paper-line);background:var(--card-bg);
  }
  .team-box .score{font-family:'Baloo 2';font-size:2rem;font-weight:800;}
  .team-blu .score{color:#3D6FE0;}
  .team-rosso .score{color:var(--coral);}
  .team-verde .score{color:var(--grass);}
  .team-box button{margin-top:6px;}

  .toast{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;
    font-family:'Baloo 2';font-weight:700;box-shadow:var(--shadow-hard);
    z-index:50;opacity:0;pointer-events:none;transition:opacity .25s ease, bottom .25s ease;
  }
  .toast.show{opacity:1;bottom:28px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>

/* ============ STORAGE ============ */
function loadSettings(){
  const defaults = {
    tipi:{nome:true, verbo:true, aggettivo:true, articolo:true},
    nomiSkills:{tipo:true, categoria:true, forma:true, genere:true, numero:true},
    aggSkills:{sottotipo:true, genere:true, numero:true},
    artSkills:{tipo:true, genere:true, numero:true}
  };
  try{
    const raw = localStorage.getItem('lv_settings');
    if(raw){
      const p = JSON.parse(raw);
      return {
        tipi:{...defaults.tipi, ...(p.tipi||{})},
        nomiSkills:{...defaults.nomiSkills, ...(p.nomiSkills||{})},
        aggSkills:{...defaults.aggSkills, ...(p.aggSkills||{})},
        artSkills:{...defaults.artSkills, ...(p.artSkills||{})}
      };
    }
  }catch(e){}
  return defaults;
}
function saveSettings(){
  try{ localStorage.setItem('lv_settings', JSON.stringify(settings)); }catch(e){}
}
function loadProgress(){
  try{
    const raw = localStorage.getItem('lv_progress');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {xp:0,totalCorrect:0,totalAnswered:0,lastPlayDate:null,streak:0,badges:[],recordLampo:0,giochiCompletati:0};
}
function saveProgress(){
  try{ localStorage.setItem('lv_progress', JSON.stringify(progress)); }catch(e){}
}

let settings = loadSettings();
let progress = loadProgress();
let sessionCorrectStreak = 0;

function dateStr(d){ return d.toISOString().slice(0,10); }
function touchStreak(){
  const today = dateStr(new Date());
  if(progress.lastPlayDate === today) return;
  if(progress.lastPlayDate){
    const y = new Date(); y.setDate(y.getDate()-1);
    if(progress.lastPlayDate === dateStr(y)) progress.streak += 1;
    else progress.streak = 1;
  } else {
    progress.streak = 1;
  }
  progress.lastPlayDate = today;
  if(progress.streak >= 7) awardBadge('settimana_di_fuoco');
  saveProgress();
}

function addXP(n){ progress.xp += n; saveProgress(); renderTopbar(); }

function recordAnswer(correct){
  progress.totalAnswered++;
  if(correct){
    progress.totalCorrect++;
    sessionCorrectStreak++;
    if(sessionCorrectStreak >= 10) awardBadge('dieci_di_fila');
  } else {
    sessionCorrectStreak = 0;
  }
  if(progress.totalCorrect >= 100) awardBadge('cento_risposte');
  saveProgress();
}

function awardBadge(id){
  if(!progress.badges.includes(id)){
    progress.badges.push(id);
    saveProgress();
    showToast((BADGES_META[id]?.ic||'🏅') + '  Nuovo traguardo: ' + (BADGES_META[id]?.nm||id));
  }
}

let toastTimer=null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ============ HELPERS ============ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function activeTipiList(){
  let list = Object.keys(settings.tipi).filter(k=>settings.tipi[k]);
  if(list.length < 2) list = Object.keys(settings.tipi);
  return list;
}
function wordsByTipi(list){ return WORDS.filter(w=>list.includes(w.t)); }

/* ============ CHE COS'È ============ */
function startCheCosE(){
  state.gameMode='checose';
  state.game={qIndex:0,total:10,score:0};
  nextCheCosEQuestion();
  state.view='game'; render();
}
function nextCheCosEQuestion(){
  const tipiList = activeTipiList();
  const pool = wordsByTipi(tipiList);
  const word = pickRandom(pool);
  const options = shuffle(tipiList.slice());
  state.game.current = {word, options, answered:false};
}
function viewCheCosE(){
  const g = state.game;
  if(g.qIndex >= g.total){
    return roundSummary(g.score, g.total, 'checose');
  }
  const c = g.current;
  const optsHtml = c.options.map(t=>{
    let cls='option-btn';
    if(c.answered){
      if(t===c.word.t) cls+=' correct';
      else if(t===c.chosen) cls+=' wrong';
    }
    return `<button class="${cls}" ${c.answered?'disabled':''} onclick="answerCheCosE('${t}')">${TIPI_LABELS[t]}</button>`;
  }).join('');
  return `
  <div class="progress-line">Domanda ${g.qIndex+1} di ${g.total} · Punteggio: ${g.score}</div>
  <div class="quiz-card">
    <div class="quiz-prompt">Che cos'è...</div>
    <div class="quiz-word">${c.word.w}</div>
    <div class="options-grid">${optsHtml}</div>
    ${c.answered ? feedbackBlock(c.chosen===c.word.t, () => {}, 'nextCheCosEBtn()') : ''}
  </div>`;
}
function answerCheCosE(t){
  const c = state.game.current;
  if(c.answered) return;
  c.answered = true; c.chosen = t;
  const correct = t===c.word.t;
  if(correct){ state.game.score++; addXP(10); }
  recordAnswer(correct);
  render();
}
function nextCheCosEBtn(){
  state.game.qIndex++;
  if(state.game.qIndex < state.game.total) nextCheCosEQuestion();
  else finishRound();
  render();
}
function feedbackBlock(correct, _unused, nextFn){
  return `<div class="feedback ${correct?'ok':'bad'}">${correct?'✅ Giusto!':'❌ Non proprio...'}</div>
  <button class="btn btn-ink" style="margin-top:14px" onclick="${nextFn}">Avanti →</button>`;
}
function finishRound(){
  progress.giochiCompletati++;
  if(progress.giochiCompletati>=1) awardBadge('prima_sfida');
  saveProgress();
}
function roundSummary(score,total,mode){
  return `
  <div class="quiz-card">
    <h2>Round completato!</h2>
    <div class="quiz-word" style="font-size:2.4rem">${score} / ${total}</div>
    <p>Ottimo lavoro, continua così!</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
      <button class="btn btn-coral" onclick="restartMode('${mode}')">Rigioca</button>
      <button class="btn btn-ghost" onclick="goModeSelect()">Altre sfide</button>
    </div>
  </div>`;
}
function restartMode(mode){
  if(mode==='checose') startCheCosE();
  else if(mode==='intruso') startIntruso();
}

};
function activeStepsFor(type){
  const cfg = ANALYSIS_CONFIG[type];
  const sk = settings[cfg.skillsKey];
  return cfg.order.filter(s=>sk[s]);
}
function goAnalizzaChoose(){ state.view='analizzaChoose'; render(); }
function viewAnalizzaChoose(){
  const types = ['nome','aggettivo','articolo'];
  const cards = types.map(t=>{
    const n = activeStepsFor(t).length;
    return `<button class="mode-card" onclick="startAnalizza('${t}')"><span class="emoji">${ANALYSIS_CONFIG[t].icon}</span><div class="txt"><strong>${ANALYSIS_CONFIG[t].label}</strong><span>${n>0?n+' caratteristiche attive':'Nessuna caratteristica attiva'}</span></div></button>`;

    ${cards}
  </div>`;
}
function startAnalizza(forcedType){
  state.gameMode='analizza';
  let type = forcedType;
  if(!type){
    const candidates = ['nome','aggettivo','articolo'].filter(t=>activeStepsFor(t).length>0);
    if(candidates.length===0){ state.game={error:true}; state.view='game'; render(); return; }
    type = pickRandom(candidates);
  }
  const steps = activeStepsFor(type);
  if(steps.length===0){ state.game={error:true}; state.view='game'; render(); return; }
  const pool = WORDS.filter(ANALYSIS_CONFIG[type].poolFilter);
  const word = pickRandom(pool);
  state.game = {type, word, steps, stepIndex:0, answered:false, forcedType};
  state.view='game'; render();
}
function viewAnalizza(){
  const g = state.game;
  if(g.error){
    return `<div class="quiz-card"><h2>Attiva un argomento</h2><p>Vai su <strong>Argomenti</strong> e attiva almeno una caratteristica da analizzare.</p><button class="btn btn-ink" onclick="goSettings()">Vai agli argomenti</button></div>`;
  }
  if(g.stepIndex >= g.steps.length){
    return analizzaSummary(g);
  }
  const cfg = ANALYSIS_CONFIG[g.type];
  const stepKey = g.steps[g.stepIndex];
  const sq = cfg.stepDef[stepKey];
  const optsHtml = sq.opts.map(opt=>{
    let cls='option-btn';
    if(g.answered){
      if(opt===g.word[sq.field]) cls+=' correct';
      else if(opt===g.chosen) cls+=' wrong';
    }
    return `<button class="${cls}" ${g.answered?'disabled':''} onclick="answerAnalizza('${opt}')">${sq.labels[opt]}</button>`;
  }).join('');
  return `
  <div class="progress-line">${cfg.label} · Parola ${g.stepIndex+1} di ${g.steps.length}</div>
  <div class="quiz-card">
    <div class="quiz-prompt">${sq.q}</div>
    <div class="quiz-word">${g.word.w}</div>
    <div class="options-grid">${optsHtml}</div>
    ${g.answered ? feedbackBlock(g.chosen===g.word[sq.field], null, 'nextAnalizzaStep()') : ''}
  </div>`;
}
function answerAnalizza(opt){
  const g = state.game;
  if(g.answered) return;
  const cfg = ANALYSIS_CONFIG[g.type];
  const field = cfg.stepDef[g.steps[g.stepIndex]].field;
  g.answered=true; g.chosen=opt;
  const correct = opt===g.word[field];
  recordAnswer(correct);
  render();
}
function nextAnalizzaStep(){
  const g = state.game;
  g.stepIndex++; g.answered=false; g.chosen=null;
  if(g.stepIndex>=g.steps.length){
    addXP(15);
    awardBadge('prima_analisi');
  }
  render();
}
function analizzaSummary(g){
  const cfg = ANALYSIS_CONFIG[g.type];
  const rows = g.steps.map(stepKey=>{
    const sq = cfg.stepDef[stepKey];
    return sq.labels[g.word[sq.field]];
  });
  return `
  <div class="quiz-card">
    <div class="quiz-prompt">🎉 Analisi completata!</div>
    <div class="quiz-word">${g.word.w}</div>
    <p style="font-family:'Baloo 2';color:var(--ink-soft)">${cfg.label} · ${rows.join(' · ')}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
      <button class="btn btn-coral" onclick="startAnalizza(${g.forcedType?"'"+g.forcedType+"'":'null'})">Un'altra parola</button>
      <button class="btn btn-ghost" onclick="goAnalizzaChoose()">Cambia tipo</button>
      <button class="btn btn-ghost" onclick="goModeSelect()">Altre sfide</button>
    </div>
  </div>`;
}

/* ============ TROVA L'INTRUSO ============ */
function pickGroupedFour(items, keyFn){
  const groups = {};
  items.forEach(it=>{ const k=keyFn(it); (groups[k]=groups[k]||[]).push(it); });
  const keys = Object.keys(groups).filter(k=>groups[k].length>=3);
  if(keys.length===0) return null;
  const majorKey = pickRandom(keys);
  const otherKeys = Object.keys(groups).filter(k=>k!==majorKey && groups[k].length>=1);
  if(otherKeys.length===0) return null;
  const minorKey = pickRandom(otherKeys);
  const majoritySample = shuffle(groups[majorKey].slice()).slice(0,3);
  const minorityItem = pickRandom(groups[minorKey]);
  const four = shuffle([...majoritySample, minorityItem]);
  return {four, majorKey, minorKey, intruder:minorityItem, axisKeyFn:keyFn};
}
function buildIntrusoAxes(){
  const axes = [];
  if(activeTipiList().length>=2) axes.push('tipo');
  if(settings.tipi.nome && settings.nomiSkills.categoria) axes.push('categoria');
  if(settings.tipi.nome && settings.nomiSkills.forma) axes.push('forma');
  if(settings.tipi.nome && settings.nomiSkills.genere) axes.push('genere');
  if(settings.tipi.nome && settings.nomiSkills.numero) axes.push('numero');
  return axes;
}
function generateIntruso(){
  const axes = shuffle(buildIntrusoAxes());
  for(const axis of axes){
    let items, keyFn, labels;
    if(axis==='tipo'){ items=wordsByTipi(activeTipiList()); keyFn=w=>w.t; labels=TIPI_LABELS; }
    else { items=WORDS.filter(w=>w.t==='nome');
      if(axis==='categoria'){ keyFn=w=>w.cat; labels=CAT_LABELS; }
      else if(axis==='forma'){ keyFn=w=>w.forma; labels=FORMA_LABELS; }
      else if(axis==='genere'){ keyFn=w=>w.gen; labels=GEN_LABELS; }
      else { keyFn=w=>w.num; labels=NUM_LABELS; }
    }
    const res = pickGroupedFour(items, keyFn);
    if(res) return {...res, axis, labels};
  }
  return null;
}
function startIntruso(){
  state.gameMode='intruso';
  state.game={qIndex:0,total:10,score:0};
  const r = generateIntruso();
  if(!r){ state.game.error=true; state.view='game'; render(); return; }
  state.game.current = {...r, answered:false};
  state.view='game'; render();
}
function viewIntruso(){
  const g = state.game;
  if(g.error){
    return `<div class="quiz-card"><h2>Servono più argomenti</h2><p>Attiva almeno due tipi di parola, oppure più caratteristiche del nome, nella pagina Argomenti.</p><button class="btn btn-ink" onclick="goSettings()">Vai agli argomenti</button></div>`;
  }
  if(g.qIndex >= g.total){
    return roundSummary(g.score, g.total, 'intruso');
  }
  const c = g.current;
  const tilesHtml = c.four.map(item=>{
    let cls='word-tile';
    if(c.answered){
      if(item.w===c.intruder.w) cls+=' correct';
      else if(c.chosen && item.w===c.chosen.w) cls+=' wrong';
    }
    return `<button class="${cls}" ${c.answered?'disabled':''} onclick="answerIntruso('${item.w}')">${item.w}</button>`;
  }).join('');
  let reasonHtml='';
  if(c.answered){
    reasonHtml = `<p style="font-family:'Baloo 2';color:var(--ink-soft);margin-top:10px">Le altre avevano in comune: <strong>${c.labels[c.majorKey]}</strong>. "${c.intruder.w}" invece era: <strong>${c.labels[c.minorKey]}</strong>.</p>`;
  }
  return `
  <div class="progress-line">Round ${g.qIndex+1} di ${g.total} · Punteggio: ${g.score}</div>
  <div class="quiz-card">
    <div class="quiz-prompt">Qual è l'intruso?</div>
    <div class="quiz-grid-4">${tilesHtml}</div>
    ${reasonHtml}
    ${c.answered ? `<button class="btn btn-ink" style="margin-top:14px" onclick="nextIntrusoBtn()">Avanti →</button>` : ''}
  </div>`;
}
function answerIntruso(wStr){
  const c = state.game.current;
  if(c.answered) return;
  c.answered=true;
  c.chosen = c.four.find(it=>it.w===wStr);
  const correct = c.chosen.w===c.intruder.w;
  if(correct){ state.game.score++; addXP(10); }
  recordAnswer(correct);
  render();
}
function nextIntrusoBtn(){
  state.game.qIndex++;
  if(state.game.qIndex < state.game.total){
    const r = generateIntruso();
    if(r) state.game.current = {...r, answered:false};
    else { state.game.error=true; }
  } else finishRound();
  render();
}

function startLampo(){
